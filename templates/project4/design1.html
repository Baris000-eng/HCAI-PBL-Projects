{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design 1: Pairwise Choice</title>
     <link rel="stylesheet" href="/static/project4_design1.css">
</head>
<body>
    <h2>Design 1: Choose Your Preferred Movie</h2>
    <p>Which of these two movies would you rather watch?</p>

    <div class="container">
        {% for movie in movies %}
        <div class="movie-card" data-id="{{ movie.id }}" onclick="selectMovie(this)">
            <h3>{{ movie.title }}</h3>
            <div class="meta">Year: {{ movie.year }}</div>
            <div class="meta">Genre: {{ movie.genre }}</div>
            <div class="meta">IMDB Rating: {{ movie.score }}</div>
        </div>
        {% endfor %}
    </div>

    <script src="/static/project4_design1.js"></script>
</body>
</html>
